[project]
name = "bert-document-review"
version = "0.1.0"
description = "Document review assistant built from BERT encoders: NER, extractive QA and embeddings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.28.0",
    "python-docx>=1.2.0",
    "sentencepiece>=0.2.2",
    "streamlit>=1.59.2",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]
